parameters:
    site_access.password: 'academy2026'
    feature.show_skills_on_overview: false

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $siteAccessPassword: '%site_access.password%'
            bool $showSkillsOnOverview: '%feature.show_skills_on_overview%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
